<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cat Reminders</title>
  <meta name="description" content="Deworming and vaccine schedules for your cats.">
  <meta name="theme-color" content="#fbf7f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1815" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cat Reminders">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand">
      <img src="icons/icon.svg" alt="" width="28" height="28">
      <span>Cat Reminders</span>
    </a>
    <a href="#/account" id="account-link" class="account-link" aria-label="Account" hidden></a>
  </header>

  <main id="app" class="page" aria-live="polite"></main>

  <div id="toast" class="toast" role="status" hidden></div>

  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <dialog id="cat-dialog" aria-labelledby="cat-dialog-title">
    <form id="cat-form" novalidate>
      <h2 id="cat-dialog-title">Add a cat</h2>
      <label class="field">
        <span>Name</span>
        <input name="name" required maxlength="40" autocomplete="off">
      </label>
      <label class="field">
        <span>Birthday</span>
        <input type="date" name="birthDate" required>
        <small class="hint">Not sure? An estimate is fine. The schedule is worked out from this date.</small>
      </label>
      <label class="field">
        <span>Sex <em>(optional)</em></span>
        <select name="sex">
          <option value="">Not set</option>
          <option value="female">Female</option>
          <option value="male">Male</option>
        </select>
      </label>
      <label class="check">
        <input type="checkbox" name="outdoor">
        <span>
          Goes outside
          <small class="hint">Adult cats that go outside are dewormed every month instead of every 3 months.</small>
        </span>
      </label>
      <label class="field">
        <span>Notes <em>(optional)</em></span>
        <textarea name="notes" rows="2" maxlength="500" placeholder="Breed, colour, vet clinic…"></textarea>
      </label>
      <p class="form-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="record-dialog" aria-labelledby="record-dialog-title">
    <form id="record-form" novalidate>
      <h2 id="record-dialog-title">Add a record</h2>
      <p class="dialog-sub" id="record-dialog-cat"></p>
      <label class="field">
        <span>What was given</span>
        <select name="type" required>
          <option value="deworm">Deworming</option>
          <option value="fvrcp">4-in-1 vaccine</option>
          <option value="rabies">Anti-rabies vaccine</option>
        </select>
      </label>
      <label class="field">
        <span>Date given</span>
        <input type="date" name="date" required>
      </label>
      <label class="field">
        <span>Product or brand <em>(optional)</em></span>
        <input name="product" maxlength="60" autocomplete="off">
      </label>
      <label class="field">
        <span>Next date from the vet <em>(optional)</em></span>
        <input type="date" name="nextDue">
        <small class="hint">If the vet wrote a next date on the vaccine card, enter it and the app will use it instead of the default schedule.</small>
      </label>
      <label class="field">
        <span>Notes <em>(optional)</em></span>
        <textarea name="notes" rows="2" maxlength="500" placeholder="Clinic, weight, any reaction…"></textarea>
      </label>
      <p class="form-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="btn danger-ghost" id="record-delete" hidden>Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>
</body>
</html>
